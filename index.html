    <th>Km / Durasi</th>

    <th>Rp / Durasi</th>

<script>


/*
=====================================================
STORAGE
=====================================================
*/

const STORAGE_KEY =
    "aplikasiNgojolData_v2";


let sessions =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || [];


let currentSessionId = null;

let currentRunning = false;

let currentStartTime = null;


/*
=====================================================
SIMPAN DATA
=====================================================
*/

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(sessions)
    );

}


/*
=====================================================
FORMAT TANGGAL
=====================================================
*/

function formatDate(dateString) {

    if (!dateString) return "";

    const d =
        new Date(dateString + "T00:00:00");

    return d.toLocaleDateString(
        "id-ID",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );

}


/*
=====================================================
NAMA HARI
=====================================================
*/

function getDayName(dateString) {

    if (!dateString) return "";

    const d =
        new Date(dateString + "T00:00:00");

    return d.toLocaleDateString(
        "id-ID",
        {
            weekday: "long"
        }
    );

}


/*
=====================================================
FORMAT JAM
=====================================================
*/

function formatTime(timestamp) {

    if (!timestamp) return "";

    return new Date(timestamp).toLocaleTimeString(
        "id-ID",
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }
    );

}


/*
=====================================================
FORMAT JAM UNTUK INPUT
=====================================================
*/

function formatTimeForInput(timestamp) {

    if (!timestamp) return "";

    const d =
        new Date(timestamp);

    return (
        String(d.getHours()).padStart(2, "0")
        + ":" +
        String(d.getMinutes()).padStart(2, "0")
        + ":" +
        String(d.getSeconds()).padStart(2, "0")
    );

}


/*
=====================================================
FORMAT DURASI
=====================================================
*/

function formatDuration(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds || 0)
        );

    const h =
        Math.floor(seconds / 3600);

    const m =
        Math.floor(
            (seconds % 3600) / 60
        );

    const s =
        seconds % 60;

    return (
        String(h).padStart(2, "0")
        + ":" +
        String(m).padStart(2, "0")
        + ":" +
        String(s).padStart(2, "0")
    );

}


/*
=====================================================
FORMAT ANGKA
=====================================================
*/

function parseNumber(value) {

    if (!value) return 0;

    return Number(
        String(value)
            .replace(/\./g, "")
            .replace(/,/g, "")
    ) || 0;

}


function formatNumber(value) {

    return Math.round(
        value || 0
    ).toLocaleString("id-ID");

}


function formatInputNumber(input) {

    if (
        input.value.trim() === ""
    ) {

        input.value = "";

        return;

    }

    input.value =
        formatNumber(
            parseNumber(input.value)
        );

}


/*
=====================================================
INPUT JAM AWAL / JAM AKHIR
=====================================================
*/

function createTimeInput(
    session,
    propertyName
) {

    const input =
        document.createElement("input");

    input.type =
        "time";

    input.step =
        "60";

    input.value =
        session[propertyName] || "";

    input.addEventListener(
        "change",
        () => {

            session[propertyName] =
                input.value;

            saveData();
            renderTable();

        }
    );

    return input;

}


/*
=====================================================
AMBIL TIMESTAMP JAM AWAL
=====================================================
*/

function getWindowStartTimestamp(session) {

    if (
        !session.date ||
        !session.jamAwal
    ) {

        return null;

    }


    const parts =
        session.jamAwal.split(":");


    const d =
        new Date(
            session.date + "T00:00:00"
        );


    d.setHours(
        Number(parts[0]),
        Number(parts[1] || 0),
        0,
        0
    );


    return d.getTime();

}


/*
=====================================================
AMBIL TIMESTAMP JAM AKHIR
=====================================================
*/

function getWindowEndTimestamp(session) {

    if (
        !session.date ||
        !session.jamAkhir
    ) {

        return null;

    }


    const parts =
        session.jamAkhir.split(":");


    let hour =
        Number(parts[0]);


    const d =
        new Date(
            session.date + "T00:00:00"
        );


    /*
    24:00 = tengah malam hari berikutnya
    */

    if (hour === 24) {

        d.setDate(
            d.getDate() + 1
        );

        d.setHours(
            0,
            Number(parts[1] || 0),
            0,
            0
        );

    }
    else {

        d.setHours(
            hour,
            Number(parts[1] || 0),
            0,
            0
        );

    }


    return d.getTime();

}


/*
=====================================================
VALIDASI WINDOW
=====================================================
*/

function getWindowInfo(session) {

    const start =
        getWindowStartTimestamp(
            session
        );


    const end =
        getWindowEndTimestamp(
            session
        );


    if (
        start === null ||
        end === null ||
        end <= start
    ) {

        return null;

    }


    return {

        start:
            start,

        end:
            end,

        duration:
            (end - start) / 1000

    };

}


/*
=====================================================
TOTAL DURASI SEMUA SEGMEN
=====================================================
*/

function getSessionTotalSeconds(session) {

    let total = 0;


    for (
        const pair of session.pairs
    ) {

        if (!pair.start)
            continue;


        if (pair.stop) {

            total +=
                (
                    pair.stop -
                    pair.start
                ) / 1000;

        }
        else if (
            session.id === currentSessionId &&
            currentRunning
        ) {

            total +=
                (
                    Date.now() -
                    pair.start
                ) / 1000;

        }

    }


    return Math.floor(
        Math.max(
            0,
            total
        )
    );

}


/*
=====================================================
DURASI SATU SEGMEN
=====================================================
*/

function getPairSeconds(pair) {

    if (!pair.start)
        return 0;


    let end;


    if (pair.stop) {

        end =
            pair.stop;

    }
    else if (
        currentRunning
    ) {

        end =
            Date.now();

    }
    else {

        return 0;

    }


    return Math.floor(
        Math.max(
            0,
            (
                end -
                pair.start
            ) / 1000
        )
    );

}


/*
=====================================================
DURASI EFEKTIF RIIL
=====================================================
*/

function getEffectiveRealSeconds(
    session,
    atTime = Date.now()
) {

    const window =
        getWindowInfo(session);


    if (!window)
        return 0;


    if (
        atTime < window.start
    ) {

        return 0;

    }


    const calculationTime =
        Math.min(
            atTime,
            window.end
        );


    let total = 0;


    session.pairs.forEach(
        pair => {

        if (!pair.start)
            return;


        if (
            pair.start >= window.end
        ) {

            return;

        }


        let pairEnd;


        if (pair.stop) {

            pairEnd =
                pair.stop;

        }
        else if (
            session.id === currentSessionId &&
            currentRunning
        ) {

            pairEnd =
                Date.now();

        }
        else {

            return;

        }


        pairEnd =
            Math.min(
                pairEnd,
                calculationTime,
                window.end
            );


        const effectiveStart =
            Math.max(
                pair.start,
                window.start
            );


        if (
            pairEnd > effectiveStart
        ) {

            total +=
                (
                    pairEnd -
                    effectiveStart
                ) / 1000;

        }

    });


    return Math.floor(
        Math.max(
            0,
            total
        )
    );

}


/*
=====================================================
DURASI EFEKTIF MAKSIMAL
=====================================================
*/

function getEffectiveMaxSeconds(
    session,
    atTime = Date.now()
) {

    const window =
        getWindowInfo(session);


    if (!window)
        return null;


    if (
        atTime < window.start
    ) {

        return null;

    }


    const targetTime =
        Math.min(
            atTime,
            window.end
        );


    const pairs =
        [...session.pairs]
            .filter(
                pair =>
                    pair.start &&
                    pair.start < window.end
            )
            .sort(
                (a, b) =>
                    a.start - b.start
            );


    let remaining =
        window.duration;


    let coveredUntil =
        window.start;


    for (
        const pair of pairs
    ) {

        const start =
            pair.start;


        let stop;


        if (pair.stop) {

            stop =
                pair.stop;

        }
        else {

            stop =
                Date.now();

        }


        if (
            stop <= window.start
        ) {

            continue;

        }


        const segmentStart =
            Math.max(
                start,
                window.start
            );


        if (
            segmentStart > targetTime
        ) {

            if (
                coveredUntil < targetTime
            ) {

                remaining -=
                    (
                        targetTime -
                        coveredUntil
                    ) / 1000;

            }

            return Math.floor(
                Math.max(
                    0,
                    remaining
                )
            );

        }


        if (
            segmentStart > coveredUntil
        ) {

            const idle =
                (
                    segmentStart -
                    coveredUntil
                ) / 1000;


            remaining -= idle;

        }


        const segmentStop =
            Math.min(
                stop,
                window.end
            );


        if (
            targetTime >= segmentStart &&
            targetTime < segmentStop
        ) {

            return Math.floor(
                Math.max(
                    0,
                    remaining
                )
            );

        }


        if (
            segmentStop > coveredUntil
        ) {

            coveredUntil =
                segmentStop;

        }


        if (
            targetTime < segmentStop
        ) {

            return Math.floor(
                Math.max(
                    0,
                    remaining
                )
            );

        }

    }


    if (
        coveredUntil < targetTime
    ) {

        remaining -=
            (
                targetTime -
                coveredUntil
            ) / 1000;

    }


    return Math.floor(
        Math.max(
            0,
            remaining
        )
    );

}


/*
=====================================================
DELETE SESI
=====================================================
*/

function deleteSession(sessionId) {

    const yakin =
        confirm(
            "Hapus sesi ini?"
        );


    if (!yakin)
        return;


    if (
        sessionId === currentSessionId &&
        currentRunning
    ) {

        alert(
            "Stop sesi terlebih dahulu sebelum menghapusnya."
        );

        return;

    }


    sessions =
        sessions.filter(
            session =>
                session.id !== sessionId
        );


    if (
        currentSessionId === sessionId
    ) {

        currentSessionId =
            null;

    }


    saveData();

    renderTable();

}


/*
=====================================================
DELETE SEGMENT
=====================================================
*/

function deletePair(
    sessionId,
    pairId
) {

    const session =
        sessions.find(
            s =>
                s.id === sessionId
        );


    if (!session)
        return;


    const pair =
        session.pairs.find(
            p =>
                p.id === pairId
        );


    if (
        pair &&
        !pair.stop
    ) {

        alert(
            "Stop segmen tersebut terlebih dahulu sebelum menghapusnya."
        );

        return;

    }


    const yakin =
        confirm(
            "Hapus Segmen ini?"
        );


    if (!yakin)
        return;


    session.pairs =
        session.pairs.filter(
            p =>
                p.id !== pairId
        );


    saveData();

    renderTable();

}


/*
=====================================================
RENDER TABLE
=====================================================
*/

function renderTable() {

    tableBody.innerHTML = "";


    if (
        sessions.length === 0
    ) {

        tableBody.innerHTML =
            `
            <tr>
                <td colspan="8"
                    class="empty">
                    Belum ada sesi
                </td>
            </tr>
            `;

        return;

    }


    sessions.forEach(
        session => {


        /*
        =============================================
        KOLOM SESI
        =============================================
        */

        const tr =
            document.createElement("tr");


        const tdSession =
            document.createElement("td");


        const dateInput =
            document.createElement("input");


        dateInput.type =
            "date";


        dateInput.className =
            "date-input";


        dateInput.value =
            session.date || "";


        dateInput.addEventListener(
            "change",
            () => {

                session.date =
                    dateInput.value;

                saveData();

                renderTable();

            }
        );


        /*
        TANGGAL TEKS DI BAWAH INPUT
        DIHAPUS SESUAI PERMINTAAN.
        */


        const dayText =
            document.createElement("div");


        dayText.className =
            "session-day";


        dayText.textContent =
            getDayName(
                session.date
            );


        /*
        =============================================
        JAM AWAL / JAM AKHIR
        =============================================
        */

        const sessionTimeBox =
            document.createElement("div");


        sessionTimeBox.className =
            "session-time-box";


        /*
        JAM AWAL
        */

        const awalLabel =
            document.createElement("label");


        awalLabel.textContent =
            "Jam Awal";


        const awalSelect =
            createTimeInput(
                session,
                "jamAwal"
            );


        /*
        JAM AKHIR
        */

        const akhirLabel =
            document.createElement("label");


        akhirLabel.textContent =
            "Jam Akhir";


        const akhirSelect =
            createTimeInput(
                session,
                "jamAkhir"
            );


        sessionTimeBox.appendChild(
            awalLabel
        );


        sessionTimeBox.appendChild(
            awalSelect
        );


        sessionTimeBox.appendChild(
            akhirLabel
        );


        sessionTimeBox.appendChild(
            akhirSelect
        );


        /*
        =============================================
        DELETE SESI
        =============================================
        */

        const deleteSessionBtn =
            document.createElement("button");


        deleteSessionBtn.textContent =
            "Delete Sesi";


        deleteSessionBtn.className =
            "delete-session";


        deleteSessionBtn.addEventListener(
            "click",
            () => {

                deleteSession(
                    session.id
                );

            }
        );


        tdSession.appendChild(
            dateInput
        );


        tdSession.appendChild(
            dayText
        );


        tdSession.appendChild(
            sessionTimeBox
        );


        tdSession.appendChild(
            deleteSessionBtn
        );


        /*
        =============================================
        KOLOM SEGMEN
        =============================================
        */

        const tdTime =
            document.createElement("td");


        session.pairs.forEach(
            (pair, index) => {

            const line =
                document.createElement("div");


            line.className =
                "time-line";


            /*
            NAMA SEGMEN
            */

            const segmentTitle =
                document.createElement("div");


            segmentTitle.className =
                "segment-title";


            segmentTitle.textContent =
                "Segmen " +
                (index + 1);


            /*
            START
            */

            const startLabel =
                document.createElement("label");


            startLabel.textContent =
                "Start";


            const startInput =
                document.createElement("input");


            startInput.type =
                "time";


            startInput.step =
                "1";


            startInput.value =
                pair.start
                ?
                formatTimeForInput(
                    pair.start
                )
                :
                "";


            startInput.addEventListener(
                "change",
                () => {

                    if (
                        startInput.value
                    ) {

                        const parts =
                            startInput.value
                                .split(":");


                        const d =
                            new Date(
                                pair.start ||
                                Date.now()
                            );


                        /*
                        Gunakan tanggal sesi.
                        */

                        if (session.date) {

                            const dateParts =
                                session.date
                                    .split("-");


                            d.setFullYear(
                                Number(dateParts[0]),
                                Number(dateParts[1]) - 1,
                                Number(dateParts[2])
                            );

                        }


                        d.setHours(
                            Number(parts[0]),
                            Number(parts[1]),
                            Number(parts[2] || 0),
                            0
                        );


                        pair.start =
                            d.getTime();

                    }
                    else {

                        pair.start =
                            null;

                    }


                    saveData();

                    renderTable();

                }
            );


            /*
            STOP
            */

            const br =
                document.createElement("br");


            const stopLabel =
                document.createElement("label");


            stopLabel.textContent =
                "Stop";


            const stopInput =
                document.createElement("input");


            stopInput.type =
                "time";


            stopInput.step =
                "1";


            stopInput.value =
                pair.stop
                ?
                formatTimeForInput(
                    pair.stop
                )
                :
                "";


            stopInput.addEventListener(
                "change",
                () => {

                    if (
                        stopInput.value
                    ) {

                        const parts =
                            stopInput.value
                                .split(":");


                        const d =
                            new Date(
                                pair.stop ||
                                pair.start ||
                                Date.now()
                            );


                        if (session.date) {

                            const dateParts =
                                session.date
                                    .split("-");


                            d.setFullYear(
                                Number(dateParts[0]),
                                Number(dateParts[1]) - 1,
                                Number(dateParts[2])
                            );

                        }


                        d.setHours(
                            Number(parts[0]),
                            Number(parts[1]),
                            Number(parts[2] || 0),
                            0
                        );


                        pair.stop =
                            d.getTime();

                    }
                    else {

                        pair.stop =
                            null;

                    }


                    saveData();

                    renderTable();

                }
            );


            /*
            DELETE
            */

            const deletePairBtn =
                document.createElement("button");


            deletePairBtn.textContent =
                "Delete";


            deletePairBtn.className =

/*
=====================================================
UPDATE PERHITUNGAN
=====================================================
*/

function updateCalculations() {

    sessions.forEach(
        session => {


        const totalSeconds =
            getSessionTotalSeconds(
                session
            );


        const km =
            Number(session.kmAkhir || 0)
            -
            Number(session.kmAwal || 0);


        const totalRp =
            Number(session.rpAplikasi || 0)
            +
            Number(session.rpCash || 0);


        /*
        =============================================
        KM
        =============================================
        */

        const kmResult =
            document.querySelector(
                `[data-km-result="${session.id}"]`
            );


        if (kmResult) {

            kmResult.textContent =
                "Selisih: " +
                formatNumber(km) +
                " Km";

        }


        /*
        =============================================
        RUPIAH
        =============================================
        */

        const rpResult =
            document.querySelector(
                `[data-rp-result="${session.id}"]`
            );


        if (rpResult) {

            rpResult.textContent =
                "Total: Rp " +
                formatNumber(totalRp);

        }


        /*
        =============================================
        RP / KM
        =============================================
        */

        const rpKmResult =
            document.querySelector(
                `[data-rp-km="${session.id}"]`
            );


        if (rpKmResult) {

            if (km > 0) {

                rpKmResult.textContent =
                    "Rp " +
                    formatNumber(
                        totalRp / km
                    ) +
                    "/km";

            }
            else {

                rpKmResult.textContent =
                    "-";

            }

        }


        /*
        =============================================
        KM / DURASI
        =============================================
        */

        const kmDurationResult =
            document.querySelector(
                `[data-km-duration="${session.id}"]`
            );


        if (kmDurationResult) {

            if (
                totalSeconds > 0 &&
                km >= 0
            ) {

                const hours =
                    totalSeconds / 3600;


                const kmPerHour =
                    km / hours;


                kmDurationResult.textContent =
                    kmPerHour.toFixed(2) +
                    " km/jam";

            }
            else {

                kmDurationResult.textContent =
                    "-";

            }

        }


        /*
        =============================================
        RP / DURASI
        =============================================
        */

        const rpDurationResult =
            document.querySelector(
                `[data-rp-duration="${session.id}"]`
            );


        if (rpDurationResult) {

            if (
                totalSeconds > 0
            ) {

                const hours =
                    totalSeconds / 3600;


                const rpPerHour =
                    totalRp / hours;


                rpDurationResult.textContent =
                    "Rp " +
                    formatNumber(
                        rpPerHour
                    ) +
                    " / jam";

            }
            else {

                rpDurationResult.textContent =
                    "-";

            }

        }


        /*
        =============================================
        TOTAL DURASI
        =============================================
        */

        const totalElement =
            document.querySelector(
                `[data-total-session="${session.id}"]`
            );


        if (totalElement) {

            totalElement.textContent =
                formatDuration(
                    totalSeconds
                );

        }


        /*
        =============================================
        EFEKTIF MAKSIMAL
        =============================================
        */

        const effectiveMaxElement =
            document.querySelector(
                `[data-effective-max="${session.id}"]`
            );


        if (effectiveMaxElement) {

            const maxSeconds =
                getEffectiveMaxSeconds(
                    session
                );


            effectiveMaxElement.textContent =
                (
                    maxSeconds === null
                    ?
                    "--:--:--"
                    :
                    formatDuration(
                        maxSeconds
                    )
                );

        }


        /*
        =============================================
        EFEKTIF RIIL
        =============================================
        */

        const effectiveRealElement =
            document.querySelector(
                `[data-effective-real="${session.id}"]`
            );


        if (effectiveRealElement) {

            const realSeconds =
                getEffectiveRealSeconds(
                    session
                );


            effectiveRealElement.textContent =
                formatDuration(
                    realSeconds
                );

        }


        /*
        =============================================
        SELISIH DURASI
        Ef. Max - Ef. Riil
        =============================================
        */

        const durationDifferenceElement =
            document.querySelector(
                `[data-duration-difference="${session.id}"]`
            );


        if (durationDifferenceElement) {

            const maxSeconds =
                getEffectiveMaxSeconds(
                    session
                );


            const realSeconds =
                getEffectiveRealSeconds(
                    session
                );


            durationDifferenceElement.textContent =
                maxSeconds === null
                ?
                "--:--:--"
                :
                formatDuration(
                    Math.max(
                        0,
                        maxSeconds -
                        realSeconds
                    )
                );

        }


        /*
        =============================================
        DURASI SETIAP SEGMEN
        =============================================
        */

        session.pairs.forEach(
            pair => {

            const durationElement =
                document.querySelector(
                    `[data-pair-id="${pair.id}"]`
                );


            if (durationElement) {

                durationElement.textContent =
                    formatDuration(
                        getPairSeconds(pair)
                    );

            }

        });

    });

}

function getTodayDate() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}

/*
=====================================================
START
=====================================================
*/

startBtn.addEventListener(
    "click",
    () => {

    if (currentRunning)
        return;


    if (!currentSessionId) {

        if (sessions.length === 0) {

            alert(
                "Belum ada sesi. Tekan 'Buat Sesi Baru' terlebih dahulu."
            );

            return;

        }


        currentSessionId =
            sessions[0].id;

    }


    const session =
        sessions.find(
            s =>
                s.id ===
                currentSessionId
        );


    if (!session)
        return;


    /*
    =============================================
    Jam Awal dan Jam Akhir harus diisi
    =============================================
    */

    if (
        !session.jamAwal ||
        !session.jamAkhir
    ) {

        alert(
            "Isi Jam Awal dan Jam Akhir terlebih dahulu."
        );

        return;

    }


    const window =
        getWindowInfo(session);


    if (!window) {

        alert(
            "Jam Akhir harus lebih besar daripada Jam Awal."
        );

        return;

    }


    /*
    =============================================
    BUAT SEGMEN BARU
    =============================================
    */

    const now =
        Date.now();


    session.pairs.push({

        id:
            Date.now() +
            Math.random(),

        start:
            now,

        stop:
            null

    });


    currentStartTime =
        now;


    currentRunning =
        true;


    saveData();


    startBtn.disabled =
        true;


    stopBtn.disabled =
        false;


    renderTable();

    alert(
        "Jangan Lupa Isi KM AWAL"
    );

});


/*
=====================================================
STOP
=====================================================
*/

stopBtn.addEventListener(
    "click",
    () => {

    if (!currentRunning)
        return;


    const session =
        sessions.find(
            s =>
                s.id ===
                currentSessionId
        );


    if (!session)
        return;


    const stopTime =
        Date.now();


    const pair =
        session.pairs[
            session.pairs.length - 1
        ];


    if (
        pair &&
        !pair.stop
    ) {

        pair.stop =
            stopTime;

    }


    currentRunning =
        false;


    currentStartTime =
        null;


    saveData();


    startBtn.disabled =
        false;


    stopBtn.disabled =
        true;


    renderTable();

    alert(
        "Jangan Lupa Isi KM AKHIR"
    );

});

                    session.kmAkhir ||
                    "",


                "Rupiah":
                    rp,


                "Rp / Km":
                    km > 0
                    ?
                    Math.round(
                        rp / km
                    )
                    :
                    "",


                "Km / Durasi":
                    sec > 0
                    ?
                    (
                        km /
                        (sec / 3600)
                    ).toFixed(2)
                    :
                    "",


                "Rp / Durasi":
                    sec > 0
                    ?
                    Math.round(
                        rp /
                        (sec / 3600)
                    )
                    :
                    ""

            });

        });


        /*
        =============================================
        SESI TANPA SEGMEN
        =============================================
        */

        if (
            session.pairs.length === 0
        ) {

            rows.push({

                "Sesi":
                    formatDate(
                        session.date
                    ) +
                    " - " +
                    getDayName(
                        session.date
                    ),


                "Jam Awal":
                    session.jamAwal ||
                    "",


                "Jam Akhir":
                    session.jamAkhir ||
                    "",


                "Segmen":
                    "",


                "Start":
                    "",


                "Stop":
                    "",


                "Durasi":
                    "",


                "Total Durasi":
                    "",


                "Durasi Efektif Maksimal":
                    effectiveMax === null
                    ?
                    ""
                    :
                    formatDuration(
                        effectiveMax
                    ),


                "Durasi Efektif Riil":
                    formatDuration(
                        effectiveReal
                    ),


                "Km Awal":
                    session.kmAwal ||
                    "",


                "Km Akhir":
                    session.kmAkhir ||
                    "",


                "Rupiah":
                    rp,


                "Rp / Km":
                    km > 0
                    ?
                    Math.round(
                        rp / km
                    )
                    :
                    "",


                "Km / Durasi":
                    "",


                "Rp / Durasi":
                    ""

            });

        }

    });


    const worksheet =
        XLSX.utils.json_to_sheet(
            rows
        );


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Ngojol"
    );


    XLSX.writeFile(
        workbook,
        "Aplikasi_Ngojol.xlsx"
    );

});


/*
=====================================================
PULIHKAN SESI YANG MASIH BERJALAN
=====================================================
*/

let runningSession = null;


for (
    let i = 0;
    i < sessions.length;
    i++
) {

    const session =
        sessions[i];


    if (!session.pairs)
        continue;


    const lastPair =
        session.pairs[
            session.pairs.length - 1
        ];


    if (
        lastPair &&
        lastPair.start &&
        !lastPair.stop
    ) {

        runningSession =
            session;

        break;

    }

}


if (runningSession) {

    currentSessionId =
        runningSession.id;


    currentRunning =
        true;


    currentStartTime =
        runningSession.pairs[
            runningSession.pairs.length - 1
        ].start;


    saveData();


    startBtn.disabled =
        true;


    stopBtn.disabled =
        false;

}
else {

    currentRunning =
        false;


    currentStartTime =
        null;


    startBtn.disabled =
        false;


    stopBtn.disabled =
        true;

}


/*
=====================================================
RENDER PERTAMA
=====================================================
*/

renderTable();


/*
=====================================================
UPDATE SETIAP 1 DETIK
=====================================================
*/

setInterval(
    () => {

        updateCalculations();
        updateCurrentClock();

    },
    1000
);


updateCurrentClock();


</script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register(
            "sw.js"
        );

    });

}
</script>
